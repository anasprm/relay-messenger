services:
  - type: web
    name: relay-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm ci
    startCommand: npm run start:server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: relay-messenger-anasprm
      - key: FIREBASE_FIRESTORE_DATABASE
        value: default
      # Paste the base64 service-account key in the Render dashboard.
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      # Optional durable upload storage (free tier, no card). When both are set,
      # Supabase is used before Firebase Storage and local disk.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: relay-uploads
      # Set to the Vercel production URL after the web app is deployed.
      - key: CLIENT_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
